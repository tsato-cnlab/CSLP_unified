services:
  emates:
    build: .
    ports:
      - "8888:8888"
    volumes:
      - .:/app
      - ./data:/app/data
      - ./output:/app/output
      - ./optimization_results:/app/optimization_results
    environment:
      - LANG=ja_JP.UTF-8
      - LC_ALL=ja_JP.UTF-8
    working_dir: /app

  # 開発用環境（bashアクセス用）
  emates-dev:
    build: .
    volumes:
      - .:/app
    environment:
      - LANG=ja_JP.UTF-8
      - LC_ALL=ja_JP.UTF-8
    working_dir: /app
    command: bash
    tty: true
    stdin_open: true
