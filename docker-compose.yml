version: '3.8'

services:
  emates-optimization:
    build: .
    ports:
      - "8888:8888"
    volumes:
      - .:/app
      - ./data:/app/data
      - ./results:/app/results
      - ./optimization_results:/app/optimization_results
    environment:
      - JUPYTER_ENABLE_LAB=yes
      - LANG=ja_JP.UTF-8
      - LC_ALL=ja_JP.UTF-8
    working_dir: /app
    command: jupyter notebook --ip=0.0.0.0 --port=8888 --no-browser --allow-root --NotebookApp.token=''

  # 開発用環境（bashアクセス用）
  emates-dev:
    build: .
    ports:
      - "8889:8888"
    volumes:
      - .:/app
    environment:
      - LANG=ja_JP.UTF-8
      - LC_ALL=ja_JP.UTF-8
    working_dir: /app
    command: bash
    tty: true
    stdin_open: true
