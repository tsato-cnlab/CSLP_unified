[project]
name = "emates"
version = "0.1.0"
description = "eMATES optimization project"
requires-python = ">=3.12"
dependencies = [
    "ipykernel>=6.29.4",
    "japanize-matplotlib>=1.1.3",
    "matplotlib>=3.9.0",
    "numpy>=1.26.4",
    "optuna>=4.3.0",
    "pandas>=2.2.2",
    "plotly>=6.5.0",
    "requests>=2.31.0",
    "rich>=14.2.0",
    "scikit-learn>=1.5.0",
    "seaborn>=0.13.2",
]

[project.optional-dependencies]
dev = [
    "jupyter",
    "notebook",
    "ipywidgets",
]

[dependency-groups]
dev = [
    "jupyter",
    "notebook",
    "ipywidgets",
    "streamlit>=1.52.1",
]
